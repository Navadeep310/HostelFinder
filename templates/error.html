{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<section class="container narrow-page error-page">
  <div class="empty-state">
    <span class="empty-icon">✦</span>
    <p class="eyebrow">{{ code }} · Something went sideways</p>
    <h1>{{ message }}</h1>
    <p>Let's get you back to nearby student stays.</p>
    <a class="button button-primary" href="{{ url_for('index') }}">Back to explore</a>
  </div>
</section>
{% endblock %}
